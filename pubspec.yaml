name: trackpense
description: "A Flutter project used to track your daily income and expenses"
publish_to: 'none'

version: 2.2.0

environment:
  sdk: ^3.9.0
  flutter: 3.50.1

dependencies:
  drift_flutter: ^0.3.1
  drift: ^2.28.1
  flutter_bloc: ^9.1.1
  flutter: {sdk: flutter}
  get_it: ^9.3.0
  go_router: ^18.1.4
  intl: any
  loading_indicator: ^4.0.2
  material_ui: ^1.11.1
  path_provider: ^2.1.5
  uuid: ^4.5.1

dev_dependencies:
  flutter_test: {sdk: flutter}
  flutter_lints: ^6.0.0
  drift_dev: ^2.28.1
  build_runner: ^2.6.0
  bloc_test: ^10.0.0

